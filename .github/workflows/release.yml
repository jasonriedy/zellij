name: Validate Windows ARM64 upgrades
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        prefix:
        - zellij
        - zellij-no-web
    steps:
    - name: Upgrade x64 to ARM64 and uninstall
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_PREFIX: ${{ matrix.prefix }}
        VALIDATION_TAG: windows-arm64-validation-9777d2d85
      run: |
        $ErrorActionPreference = 'Stop'
        $prefix = $env:RELEASE_PREFIX
        $oldDir = Join-Path $env:RUNNER_TEMP 'old-release'
        $newDir = Join-Path $env:RUNNER_TEMP 'new-release'
        gh release download v0.45.1 --repo zellij-org/zellij --pattern "$prefix-x86_64-pc-windows-msvc-installer.msi" --dir $oldDir
        if ($LASTEXITCODE -ne 0) { throw 'Failed to download previous x64 release' }
        gh release download $env:VALIDATION_TAG --repo jasonriedy/zellij --pattern "$prefix-aarch64-pc-windows-msvc-installer.msi" --dir $newDir
        if ($LASTEXITCODE -ne 0) { throw 'Failed to download ARM64 release' }
        $oldMsi = (Get-ChildItem $oldDir -Filter '*.msi').FullName
        $newMsi = (Get-ChildItem $newDir -Filter '*.msi').FullName
        $installer = New-Object -ComObject WindowsInstaller.Installer
        function Get-ProductCode($path) {
            $db = $installer.OpenDatabase($path, 0)
            $view = $db.OpenView("SELECT Value FROM Property WHERE Property = 'ProductCode'")
            [void]$view.Execute()
            $record = $view.Fetch()
            $code = $record.StringData(1)
            [void][System.Runtime.InteropServices.Marshal]::ReleaseComObject($record)
            [void][System.Runtime.InteropServices.Marshal]::ReleaseComObject($view)
            [void][System.Runtime.InteropServices.Marshal]::ReleaseComObject($db)
            return $code
        }
        function Invoke-Msi($operation, $path, $logName) {
            $log = Join-Path $env:RUNNER_TEMP $logName
            $p = Start-Process msiexec.exe -ArgumentList @($operation, "`"$path`"", '/qn', '/norestart', '/L*v', "`"$log`"") -PassThru -Wait
            if ($p.ExitCode -notin 0, 3010) {
                Get-Content $log -Tail 100
                throw "MSI operation $operation failed: $($p.ExitCode)"
            }
        }
        function Test-ProductRegistered([string]$code) {
            foreach ($root in 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall') {
                if (Test-Path (Join-Path $root $code)) { return $true }
            }
            return $false
        }
        [string]$oldCode = Get-ProductCode $oldMsi
        [string]$newCode = Get-ProductCode $newMsi
        if ($oldCode -notmatch '^\{[0-9A-Fa-f-]{36}\}$' -or $newCode -notmatch '^\{[0-9A-Fa-f-]{36}\}$') { throw "Invalid product codes: $oldCode / $newCode" }
        Write-Output "Product codes: x64 $oldCode; ARM64 $newCode"
        Invoke-Msi '/i' $oldMsi 'install-old.log'
        if (-not (Test-ProductRegistered $oldCode)) { throw 'Previous x64 product is not registered' }
        $installed = Join-Path $env:LOCALAPPDATA 'Zellij'
        $cli = Join-Path $installed 'zellij.exe'
        $version = & $cli --version
        if ($LASTEXITCODE -ne 0 -or $version -notmatch '0\.45\.1') { throw "Old CLI failed: $version" }
        Invoke-Msi '/i' $newMsi 'upgrade-arm64.log'
        try {
            if (Test-ProductRegistered $oldCode) { throw 'Old x64 product was not removed' }
            if (-not (Test-ProductRegistered $newCode)) { throw 'ARM64 product is not registered' }
            foreach ($name in 'zellij.exe', 'zellij-terminal.exe') {
                $bytes = [System.IO.File]::ReadAllBytes((Join-Path $installed $name))
                $pe = [BitConverter]::ToInt32($bytes, 0x3c)
                if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0xAA64) { throw "$name is not ARM64 after upgrade" }
            }
            $version = & $cli --version
            if ($LASTEXITCODE -ne 0 -or $version -notmatch '0\.46\.0') { throw "Upgraded CLI failed: $version" }
            Write-Output "PASS: x64 v0.45.1 upgraded to ARM64 $version; old product registration removed"
        } finally {
            Invoke-Msi '/x' $newMsi 'uninstall-new.log'
        }
        if (Test-Path $cli) { throw 'CLI remains after uninstall' }
        if (Test-Path (Join-Path $installed 'zellij-terminal.exe')) { throw 'Terminal remains after uninstall' }
        Write-Output 'PASS: both ARM64 executables removed after uninstall'
    - name: Keep installer logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upgrade-logs-${{ matrix.prefix }}
        path: ${{ runner.temp }}/*.log
        retention-days: 7
